<style>
/* Stile Omet unico v1.0 (claude/stile-omet-unico.md): token, font di sistema, componenti */
:root{
  --omet:#093E83; --omet-2:#1D5BB0; --omet-scuro:#082E60;
  --ink:#1B2430; --mute:#5D6B7C; --line:#D7DEE8; --band:#EEF3F9; --bg:#E9EDF2; --paper:#FFFFFF;
  --ok:#1E9E55; --ok-t:#1F7A3A; --ok-bg:#E5F4EA;
  --warn:#F0B400; --warn-t:#C76A00; --warn-bg:#FFF3C4; --warn-b:#E0B400;
  --bad:#D7262B; --bad-t:#C62828; --bad-bg:#FDE8E8;
  --info:#3C8DDC; --info-t:#1D5BB0; --info-bg:#EEF3F9;
  --neu:#AEB6C4; --neu-t:#6B7785; --neu-bg:#EEF0F3;
  --flag:#6A3FB5; --flag-bg:#EFE8FB;
  --f-ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-code:Consolas,ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --r:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4}
button{font:inherit}
:focus-visible{outline:2px solid var(--omet);outline-offset:2px}
.code{font-family:var(--f-code);font-weight:700;color:var(--omet)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.muted{color:var(--mute)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid var(--line);background:var(--paper);color:var(--omet);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--omet-2)}
.btn.primary{background:var(--omet);color:#fff;border-color:var(--omet)}
.btn.primary:hover{background:var(--omet-scuro)}
.btn.danger{color:var(--bad-t);border-color:var(--bad-t)}
.btn.sm{min-height:28px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-height:36px;padding:6px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--omet);outline:none}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mute)}
label.chk{display:block;position:relative;padding-left:28px;font-size:14px;color:var(--ink);min-height:22px}
label.chk input{position:absolute;left:0;top:1px;min-height:auto;margin:0;width:18px;height:18px;accent-color:var(--omet)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.badge.ok{background:var(--ok-bg);color:var(--ok-t)} .badge.warn{background:var(--warn);color:#3a2a00} .badge.bad{background:var(--bad);color:#fff}
.badge.info{background:var(--info-bg);color:var(--info-t)} .badge.neu{background:var(--neu-bg);color:var(--neu-t)} .badge.flag{background:var(--flag-bg);color:var(--flag)}
.avviso{border-left:4px solid var(--info);background:var(--info-bg);padding:10px 12px;border-radius:var(--r);font-size:14px}
.avviso.warn{border-color:var(--warn-b);background:var(--warn-bg)} .avviso.bad{border-color:var(--bad);background:var(--bad-bg)} .avviso.ok{border-color:var(--ok);background:var(--ok-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1B2430;color:#fff;padding:10px 16px;border-radius:var(--r);z-index:60;font-size:14px;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast button{margin-left:10px;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
table{border-collapse:collapse;font-size:14px;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--band);position:sticky;top:0}
tr:hover td{background:var(--band)}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--omet);cursor:pointer;padding:0;font-size:12px;font-weight:600}
/* guida */
.guida .pills{display:flex;gap:6px;flex-wrap:wrap}
.guida .pills button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.guida .pills button[aria-pressed="true"]{background:var(--band);border-color:var(--omet);color:var(--omet);font-weight:600}
.guida ol{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:p}
.guida li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:p;font-size:14px}
.guida li::before{content:counter(p);width:26px;height:26px;border-radius:50%;background:var(--omet);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- OMET:COMMON END -->

<style>
/* Layout della mensa (mobile prima di tutto): banda blu con logo, settimana a schede giorno, ordine in un pannello che sale dal basso */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--omet)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header.band{background:var(--omet);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.band .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
header.band img{height:30px;width:auto;display:block}
header.band .t{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;opacity:.92;border-left:1px solid rgba(255,255,255,.35);padding-left:10px}
header.band .who{margin-left:auto;display:flex;gap:6px;align-items:center}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn .dot{background:var(--warn);color:#3a2a00;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.demo{background:var(--warn-bg);border-bottom:1px solid var(--warn-b);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;padding-block:6px;flex-wrap:wrap}
#busy{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:50;background:linear-gradient(90deg,transparent,#8FB4EA,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
.offline{background:var(--neu-bg);font-size:13px;text-align:center;padding:5px}
main{padding-block:16px 10px;display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.box > .eyebrow:first-child{color:var(--omet)}
.note{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--mute);background:var(--paper)}
.empty{padding:24px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);background:var(--paper)}
.err{color:var(--bad-t);font-size:14px;min-height:1.2em}
/* accesso */
.login{max-width:400px;width:100%;margin:12px auto;display:grid;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.pin{display:flex;gap:8px;justify-content:center}
.pin span{width:40px;height:50px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;font-size:24px;font-family:var(--f-code)}
.pin span.f{border-color:var(--omet);background:var(--band)}
.pin span.x{opacity:.35;border-style:dashed}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:13px 0;font-size:21px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-family:var(--f-code);touch-action:manipulation}
.pad button:active{background:var(--band)}
.linkbtn{background:none;border:0;color:var(--omet);cursor:pointer;font-weight:600;padding:4px 0}
/* settimana */
.weekhead{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.weekhead .nav{margin-left:auto;display:flex;gap:6px}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.day:hover{border-color:var(--omet-2)}
.day .d{display:grid;justify-items:center;line-height:1.05}
.day .d b{font-size:24px;font-weight:600}
.day .d small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.day .s{min-width:0;display:grid;gap:4px;justify-items:start}
.day .s .sum{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.day.today{box-shadow:inset 4px 0 0 var(--omet)}
.day.past{opacity:.72}
.chev{color:var(--mute);font-size:20px}
/* pannello */
.scrim{position:fixed;inset:0;background:rgba(8,20,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:94%;overflow:auto;overscroll-behavior:contain;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:12px;max-height:90%}}
.sheet .top{display:flex;align-items:start;gap:10px}
.sheet .top .x{margin-left:auto}
.grp{display:grid;gap:8px}
.grp .gh{display:flex;justify-content:space-between;align-items:baseline}
.dishes{display:grid;gap:6px}
.dish{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;text-align:left;color:var(--ink);width:100%;touch-action:manipulation}
.dish .k{font-family:var(--f-code);font-weight:700;display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--band);color:var(--omet)}
.dish .n{min-width:0}
.dish .a{font-size:12px;color:var(--mute);text-align:right}
.dish .al{display:block;font-size:12px;color:var(--warn-t);font-weight:600}
.dish[aria-pressed="true"]{border-color:var(--omet);background:var(--band)}
.dish[aria-pressed="true"] .k{background:var(--omet);color:#fff}
.dish:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--ink);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--omet);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--paper);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-bottom:calc(-16px - env(safe-area-inset-bottom,0px))}
.actions .btn.primary{flex:1;min-height:44px}
/* gestione */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--mute);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--omet);border-color:var(--omet)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-top:4px solid var(--omet);border-radius:var(--r);padding:8px 10px;background:var(--paper)}
.tile.warn{border-top-color:var(--warn)} .tile.bad{border-top-color:var(--bad)} .tile.ok{border-top-color:var(--ok)}
.big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tot{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tot .c{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:5px;align-content:start}
.tot .c .l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.tot .c .l span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tot .c .l.z{color:var(--neu)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r)}
td.x{text-align:center;font-family:var(--f-code);font-weight:700}
pre.txt{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:13px;white-space:pre-wrap;max-height:320px;overflow:auto;margin:0;font-family:var(--f-code)}
.mgrid{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:62px 44px 1fr 66px 36px 36px 30px;gap:5px;align-items:center}
.mrow input,.mrow select{padding:4px 6px;font-size:14px;min-height:32px}
.mrow input[type=checkbox]{min-height:auto;width:18px;height:18px;justify-self:center;accent-color:var(--omet)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;background:var(--paper)}
.item .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .h b{margin-right:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
details.box summary{cursor:pointer;font-weight:600;color:var(--omet)}
/* stampa: si stampa solo l'area #printarea */
#printarea{display:none}
@media print{
  body{background:#fff}
  body::before,header,.demo,.offline,main,.foot,#layer,.toast{display:none!important}
  #printarea{display:block}
}
@media (max-width:640px){
  .mrow{grid-template-columns:54px 40px 1fr 30px;}
  .mrow .opt{display:none}
  .hide-sm{display:none}
  th,td{padding:6px 6px}
}
@media (pointer:coarse){input,select,textarea{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script>
"use strict";
/* ===================== base ===================== */
const TOOL = "Mensa", VERS = MensaCore.VERSIONE, VDATA = MensaCore.DATA_VERSIONE;
const CFGAPP = window.MENSA_CONFIG || {};
const DEMO = !CFGAPP.apiUrl;
const U = MensaCore.util, CATS = MensaCore.CATS;
const $ = s => document.querySelector(s);
const esc = U.esc, it = U.it, pd = U.pd, iso = U.iso, cap = U.cap;
const GIORNI = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"], GIORNI_L = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const ALLERGENI = {1:"Cereali con glutine",2:"Crostacei",3:"Uova",4:"Pesce",5:"Arachidi",6:"Soia",7:"Latte",8:"Frutta a guscio",9:"Sedano",10:"Senape",11:"Sesamo",12:"Solfiti",13:"Lupini",14:"Molluschi"};
const LS = { get(k){try{return localStorage.getItem("omet.mensa."+k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem("omet.mensa."+k):localStorage.setItem("omet.mensa."+k,v)}catch(e){}},
  json(k,d){try{const v=localStorage.getItem("omet.mensa."+k);return v?JSON.parse(v):d}catch(e){return d}}, setJson(k,v){try{localStorage.setItem("omet.mensa."+k,JSON.stringify(v))}catch(e){}} };
const oggi = () => iso(new Date());
const tsIt = U.tsIt;
function toast(t, ms, btn){const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;
  if(btn){const b=document.createElement("button");b.textContent=btn.t;b.onclick=()=>{btn.f();e.remove()};e.appendChild(b)}
  document.body.appendChild(e);setTimeout(()=>e.remove(),ms||4500)}
function appUrl(){return CFGAPP.appUrl || (location.origin + location.pathname.replace(/index\.html$/,""))}

/* ===================== collegamento ai dati ===================== */
let demoEnv=null, demoCore=null;
function initDemo(){
  const saved = LS.json("prova", null);
  const data = saved || {};
  demoEnv = MensaDemoEnv.makeEnv({ data, outbox: LS.json("prova.posta", []), appUrl: appUrl(),
    onChange: d => LS.setJson("prova", d) });
  const send = demoEnv.mail.send; demoEnv.mail.send = m => { send(m); LS.setJson("prova.posta", demoEnv.outbox.slice(-60)); };
  demoCore = MensaCore.create(demoEnv);
  if (!saved) seedDemo();
}
function seedDemo(){
  const c=(a,p,t)=>demoCore.call(a,p,t);
  c("registra",{username:"Admin prova",pin:"0000"});
  const A=c("login",{username:"Admin prova",pin:"0000"}).token;
  c("registra",{username:"Addetto prova",pin:"1111"}); c("registra",{username:"Utente prova",pin:"2222"}); c("registra",{username:"Nuovo collega",pin:"3333"});
  const us=c("utenti",{},A).utenti;
  c("gestisciUtente",{id:us.find(u=>u.username==="Addetto prova").id,azione:"approva",ruolo:"addetto"},A);
  c("gestisciUtente",{id:us.find(u=>u.username==="Utente prova").id,azione:"approva",ruolo:"utente"},A);
  if (self.DEMO_MENU) c("salvaMenu",{settimane:self.DEMO_MENU,origine:"MENU NOVEMBRE 2026.pdf (prova)"},A);
  c("esci",{},A);
  demoEnv.outbox.length=0; LS.setJson("prova.posta",[]);
}
const NO_RIPROVA = new Set(["registra","gestisciUtente","provaEmail","tickOra"]);
let inCorso=0;
function busy(d){ inCorso=Math.max(0,inCorso+d); const b=document.getElementById("busy"); if(b) b.hidden=!inCorso; }
async function api(action, params){
  if (DEMO) return api1(action, params);
  busy(1);
  try {
    try { return await api1(action, params); }
    catch(e){ if(e.code!=="rete"||NO_RIPROVA.has(action)||navigator.onLine===false) throw e; await new Promise(r=>setTimeout(r,1200)); return await api1(action, params); }
  } finally { busy(-1); }
}
async function api1(action, params){
  const token = LS.get("token");
  if (DEMO) {
    try { return JSON.parse(JSON.stringify(demoCore.call(action, params||{}, token))); }
    catch(e){ if(e.code==="auth") sessionLost(); throw e; }
  }
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 40000);
  let res;
  try {
    res = await fetch(CFGAPP.apiUrl, { method:"POST", body: JSON.stringify({ action, params: params||{}, token }), signal: ctl.signal, redirect:"follow" });
  } catch(e) { const x=new Error(navigator.onLine===false?"Sei offline: controlla la connessione.":"Server non raggiungibile. Riprova tra poco."); x.code="rete"; throw x; }
  finally { clearTimeout(tm); }
  let j; try { j = await res.json(); } catch(e){ const x=new Error("Risposta del server non valida."); x.code="rete"; throw x; }
  if (!j.ok) { const x=new Error(j.error||"Errore"); x.code=j.code; if(j.code==="auth") sessionLost(); throw x; }
  return j.data;
}
function sessionLost(){ LS.set("token",null); S.me=null; setTimeout(render,0); }

const S = { me:null, cfg:null, settimane:[], week:null, wdata:null, view:"week", tab:"riep", riepDay:null, inAttesa:0, offline:false, guidaTab:"ordinare", draft:null };

async function boot(){
  if (DEMO) { initDemo(); setInterval(()=>{ try{demoCore.tick()}catch(e){} }, 30000); try{demoCore.tick()}catch(e){} }
  renderFoot(); renderBars();
  if (!DEMO && !LS.get("token")) api1("info").catch(()=>{});   // risveglia il server mentre si scrive il PIN
  if (LS.get("token")) await loadMe(); else render();
}
async function loadMe(){
  try {
    const r = await api("io",{lunedi:S.week||""});
    S.me = r.io; S.cfg = r.cfg; S.settimane = r.settimane; S.inAttesa = r.inAttesa||0; S.offline=false;
    const w = r.settimana; delete r.settimana; LS.setJson("cache.io", r);
    if (w) { S.week = w.lunedi; setWeek(w); } else { S.week = pickWeek(); S.wdata=null; }
    renderBars();
  } catch(e) {
    if (e.code==="rete") { const c=LS.json("cache.io",null); if(c){S.me=c.io;S.cfg=c.cfg;S.settimane=c.settimane;S.offline=true;if(!S.week)S.week=pickWeek();await loadWeek();return} }
    if (e.code!=="auth") toast(e.message);
  }
  render();
}
function pickWeek(){ const t=oggi(); const w=S.settimane.find(w=>w.giorni.some(d=>d>=t)); return w ? w.lunedi : (S.settimane.length ? S.settimane[S.settimane.length-1].lunedi : U.lunedi(t)); }
function setWeek(w){ S.wdata=w; LS.setJson("cache.w."+w.lunedi,{t:new Date().toISOString(),d:w}); }
async function loadWeek(){
  if (!S.week) return;
  try { S.wdata = await api("settimana",{lunedi:S.week}); LS.setJson("cache.w."+S.week, {t:new Date().toISOString(), d:S.wdata}); S.offline=false; }
  catch(e){ if(e.code==="rete"){ const c=LS.json("cache.w."+S.week,null); S.wdata=c?c.d:null; S.offline=true; S.offlineT=c?c.t:null; } else throw e; }
  renderBars();
}

function sheet(html, onClose){
  const L=$("#layer");
  L.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=()=>{L.innerHTML="";document.removeEventListener("keydown",onKey);document.body.style.overflow="";if(onClose)onClose()};
  const onKey=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",onKey); document.body.style.overflow="hidden";
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  L.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  return {close, root:L.querySelector(".sheet")};
}

async function copia(t){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ const a=document.createElement("textarea"); a.value=t; a.setAttribute("readonly",""); a.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(a); a.select(); a.setSelectionRange(0,t.length); const ok=document.execCommand("copy"); a.remove(); return ok; }catch(e){ return false; }
}
function showText(t){const sh=sheet(`<div class="top"><h2>Testo per la mensa</h2><button class="btn sm x" data-close>✕</button></div><div class="muted" style="font-size:13px">Tieni premuto sul testo, Seleziona tutto, Copia.</div><pre class="txt" style="user-select:all;-webkit-user-select:all">${esc(t)}</pre>`)}
function stampaDoc(html, titolo){
  const pa=$("#printarea"); const m=html.match(/<body>([\s\S]*)<\/body>/); pa.innerHTML=(m?m[1]:html);
  let st=document.getElementById("pagestyle"); if(!st){st=document.createElement("style");st.id="pagestyle";document.head.appendChild(st)}
  st.textContent="@page{size:A4 landscape;margin:10mm} #printarea .foglio{page-break-after:always} #printarea .foglio:last-child{page-break-after:auto} #printarea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}";
  const old=document.title; document.title=titolo;
  try{navigator.clipboard&&navigator.clipboard.writeText(titolo).catch(()=>{})}catch(e){}
  const done=()=>{document.title=old;pa.innerHTML="";window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);
  setTimeout(()=>{window.print();setTimeout(()=>{if(document.title===titolo&&!matchMedia("print").matches){}},500)},60);
}
function scarica(nome, testo, tipo){const b=new Blob([testo],{type:tipo||"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

async function readPdf(f){
  const ps=$("#ps");ps.innerHTML="Lettura del PDF…";
  try{const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    const r=MenuPdf.parsePages(await MenuPdf.itemsFromPdf(doc));
    if(!r.settimane.length)throw new Error("nessuna settimana riconosciuta. Il PDF è una scansione o ha un formato diverso?");
    // manzo affettato: nota "MANZO AFF.TO" → proposta di aggiungerlo come secondo M (da confermare)
    r.origine=f.name; S.draft=r;
    const ng=r.settimane.reduce((s,w)=>s+w.giorni.length,0);
    ps.innerHTML=`<div class="avviso ${r.avvisi.length?"warn":"ok"}">${r.avvisi.length?"⚠ ATTENZIONE&nbsp; ":"✓ OK&nbsp; "}Letti ${r.settimane.length} settimane, ${ng} giorni.${r.avvisi.length?"<br>"+r.avvisi.map(esc).join("<br>"):" Controlla e salva."}</div>`;

  const ro=$("#ro");ro.innerHTML='<div class="muted">Calcolo…</div>';
  try{const R=await api("report",{mese});
    ro.innerHTML=R.righe.length?`<div class="tiles"><div class="tile"><div class="eyebrow">Pasti</div><div class="big">${R.totali.pasti}</div></div><div class="tile"><div class="eyebrow">Variazioni</div><div class="big">${R.totali.variazioni}</div></div><div class="tile warn"><div class="eyebrow">Annullamenti</div><div class="big">${R.totali.annullati}</div></div><div class="tile bad"><div class="eyebrow">Fuori orario</div><div class="big">${R.totali.tardivi}</div></div></div>
     <div class="muted" style="font-size:13px">Ordinato per numero di annullamenti: in cima chi annulla di più.</div>
     <div class="scroll"><table><thead><tr><th>Utente</th><th>Pasti</th><th>Variazioni</th><th>Annullati</th><th>Fuori orario</th><th class="hide-sm">Inseriti da addetti</th></tr></thead><tbody>${R.righe.map(r=>`<tr><td>${esc(r.username)}${r.ospite?' <span class="badge flag">⚑ ospite</span>':""}</td><td>${r.pasti}</td><td>${r.variazioni||""}</td><td>${r.annullati?`<b>${r.annullati}</b>`:""}</td><td>${r.annullatiTardivi?`<span class="badge bad">✗ ${r.annullatiTardivi}</span>`:""}</td><td class="hide-sm">${r.perConto||""}</td></tr>`).join("")}</tbody></table></div>
     <div class="row"><button class="btn" id="rx">Scarica CSV per Excel</button></div>`:'<div class="muted">Nessun ordine in questo mese.</div>';
    if($("#rx"))$("#rx").onclick=async()=>{const x=await api("csvReport",{mese});scarica(x.nome,x.csv)};
  }catch(e){ro.innerHTML=`<div class="avviso bad">✗ ERRORE&nbsp; ${esc(e.message)}</div>`}
}

/* ===================== service worker (app installabile e uso senza rete) ===================== */
if ("serviceWorker" in navigator && location.protocol!=="file:") {
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const ask=w=>toast("È disponibile una nuova versione della app",15000,{t:"Aggiorna",f:()=>w.postMessage("skipWaiting")});
    if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)ask(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let ricaricato=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{if(ricaricato)return;ricaricato=true;location.reload()});
}
if (DEMO) { const s=document.createElement("script"); s.src="js/demo-menu.js"; s.onload=boot; s.onerror=boot; document.head.appendChild(s); } else boot();
</script>
